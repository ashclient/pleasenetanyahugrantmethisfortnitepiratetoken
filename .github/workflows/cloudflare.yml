name: Deploy Cloudflare sync and build EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sync-service/**'
      - '.github/workflows/cloudflare.yml'
permissions:
  contents: write
concurrency:
  group: cloudflare-sync-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      endpoint: ${{ steps.deploy.outputs.endpoint }}
    steps:
      - uses: actions/checkout@v4
      - name: Check one-time Cloudflare setup
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Setup needed: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Actions secrets, then run this workflow again. No deployment or EXE release was attempted.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v4
        if: steps.credentials.outputs.ready == 'true'
        with:
          node-version: '22'
      - name: Install pinned deployment tool
        if: steps.credentials.outputs.ready == 'true'
        working-directory: sync-service
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Create or reuse database and deploy API
        if: steps.credentials.outputs.ready == 'true'
        id: deploy
        working-directory: sync-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node deploy.mjs
      - name: Test two clients against deployed API
        if: steps.deploy.outputs.endpoint != ''
        env:
          TREASURE_LEDGER_SYNC_URL: ${{ steps.deploy.outputs.endpoint }}
        run: python scripts/test_link_service.py
      - name: Retain endpoint for future app builds
        if: steps.deploy.outputs.endpoint != ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sync-service/endpoint.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record deployed Cloudflare sync endpoint'
            git push origin HEAD:main
          fi
  windows:
    needs: deploy
    if: needs.deploy.outputs.endpoint != ''
    uses: ./.github/workflows/windows.yml
    with:
      sync_endpoint: ${{ needs.deploy.outputs.endpoint }}
