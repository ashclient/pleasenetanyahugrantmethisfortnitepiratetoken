name: Build Windows EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/checkout@v4
        with:
          repository: LED-N/Fortnite-ChestCounter
          ref: 1f387987737cfd606611d5b8d294d5db04af9eab
          path: external/chestreader
      - name: Build independent replay reader
        run: dotnet publish replay-worker/ReplayWorker.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -o worker-dist
      - name: Package corresponding replay-reader source
        run: python scripts/package_replay_worker.py
      - name: Test counting and history
        run: dotnet run --project tests/TrackerTests.csproj -c Release
      - name: Publish standalone Windows executable
        run: dotnet publish src/TreasureLedger.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o dist
      - name: Test packaged executable and render overlay
        shell: pwsh
        run: |
          $p = Start-Process ./dist/TreasureLedger.exe -ArgumentList '--self-test' -Wait -PassThru
          Get-Content smoke-test.txt
          if (Test-Path live-regression.txt) { Get-Content live-regression.txt }
          if ($p.ExitCode -ne 0 -and (Test-Path stack-debug.txt)) { Get-Content stack-debug.txt }
          if ($p.ExitCode -ne 0) { throw "Packaged app self-test failed: $($p.ExitCode)" }
      - name: Hash executable
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/TreasureLedger.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  TreasureLedger.exe" | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TreasureLedger-Windows-x64
          path: |
            dist/TreasureLedger.exe
            dist/SHA256SUMS.txt
            worker-dist/ReplayWorkerSource.zip
            overlay-preview.png
            overlay-large-counts.png
            overlay-background-check.png
            smoke-test.txt
            visual-regression.txt
            live-regression.txt
            japanese-ocr.txt
            japanese-ocr-sample.png
      - name: Publish downloadable build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "v0.4.2-build.${{ github.run_number }}"
          $notes = @'
          English is now the default HUD language for new installs. Saved selections, including Japanese, are preserved.

          Adds an independent focused text/XP backup for rare chests (English RARE CHEST and Japanese レア宝箱/レアな宝箱/レアチェスト). It requires stable named-chest text plus nearby XP, waits for the notification to finish, and suppresses itself if the visual detector handled that popup. Existing fast normal-chest detection is unchanged. This conservative backup can still miss partially recognized mixed stacks and requires the selected Windows OCR language feature. Synthetic English Windows OCR and Japanese parsing are tested; actual Japanese rare-chest capture still needs validation.

          Fixes the reported replay-overlap review condition when a populated match overlaps an empty waiting-room/next-match record. Populated fragments fully within one replay can be linked as a group; only the aggregate missing deficit is added. Histories crossing different game time ranges remain flagged. Broken chests are still checked after the replay finishes, not immediately. Detailed local replay-diagnosis.json is included by Save diagnosis, and the last review/result stays visible. Real completed replay attribution still needs verification with a player replay.

          Keeps lobby reset, lifetime history, transparent icons, Alt+T, rewards and bundled independent replay worker. Enable Fortnite Record Replays for after-match corrections. Complete worker source/notices are in ReplayWorkerSource.zip and extractable from the tray. No game memory access, injection or automatic uploads.
          '@
          $notes | Set-Content release-notes.txt
          gh release create $tag dist/TreasureLedger.exe dist/SHA256SUMS.txt worker-dist/ReplayWorkerSource.zip --target '${{ github.sha }}' --title "Treasure Ledger $tag" --notes-file release-notes.txt --prerelease
