name: Build Windows EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test counting and history
        run: dotnet run --project tests/TrackerTests.csproj -c Release
      - name: Publish standalone Windows executable
        run: dotnet publish src/TreasureLedger.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o dist
      - name: Test packaged executable and render overlay
        shell: pwsh
        run: |
          $p = Start-Process ./dist/TreasureLedger.exe -ArgumentList '--self-test' -Wait -PassThru
          Get-Content smoke-test.txt
          if ($p.ExitCode -ne 0) { throw "Packaged app self-test failed: $($p.ExitCode)" }
      - name: Hash executable
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/TreasureLedger.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  TreasureLedger.exe" | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TreasureLedger-Windows-x64
          path: |
            dist/TreasureLedger.exe
            dist/SHA256SUMS.txt
            overlay-preview.png
            overlay-large-counts.png
            overlay-background-check.png
            smoke-test.txt
            visual-regression.txt
            japanese-ocr.txt
            japanese-ocr-sample.png
      - name: Publish downloadable build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "v0.2.1-build.${{ github.run_number }}"
          $notes = @'
          Transparent icon-and-number overlay with bundled Fortnite artwork. Click-through by default; Alt+T unlocks/locks dragging and clicks. Dynamically measured counts wrap without overlap. Adds screenshot-verified Japanese chest XP and 精霊ギズモ visual detectors alongside OCR. These two counters can work without the Japanese Windows OCR feature; other Japanese rewards still require it. Top-center reward OCR is enlarged; matching ignores the XP amount. Local diagnostics remain available. Japanese HUD by default, English selector, persistent match and reward history. Standalone Windows x64 executable; no .NET installation required.

          This is an experimental visual tracker. Counts are estimates from on-screen notifications, not authoritative game telemetry. Japanese chest and gizmo notification crops supplied by the user are tested, including repeats, rescaling and negative controls. Actual live screen capture has not been tested. Use Windowed Fullscreen with visible notifications. It cannot recover previous lifetime counts or reliably distinguish stacked chest notifications. OCR language features for the chosen HUD language must be installed in Windows. Use Alt+T to unlock the overlay, then right-click for settings and history. If tracking still misses, Save diagnosis exports the last captured Fortnite frame and OCR text locally for troubleshooting.

          Checks: synthetic counting/state/persistence tests, packaged executable smoke test, English synthetic Windows OCR integration (Japanese OCR integration is also run when its optional Windows feature is available; check smoke-test.txt for PASS or SKIPPED), transparent overlay rendering, large-count layout at 150% scale, click-through, and Alt+T registration. No live-game accuracy claim.
          '@
          $notes | Set-Content release-notes.txt
          gh release create $tag dist/TreasureLedger.exe dist/SHA256SUMS.txt --target '${{ github.sha }}' --title "Treasure Ledger $tag" --notes-file release-notes.txt --prerelease
