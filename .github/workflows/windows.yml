name: Build Windows EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/checkout@v4
        with:
          repository: LED-N/Fortnite-ChestCounter
          ref: 1f387987737cfd606611d5b8d294d5db04af9eab
          path: external/chestreader
      - name: Build independent replay reader
        run: dotnet publish replay-worker/ReplayWorker.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -o worker-dist
      - name: Package corresponding replay-reader source
        run: python scripts/package_replay_worker.py
      - name: Test counting and history in Pacific timezone
        shell: pwsh
        run: |
          $originalZone = (Get-TimeZone).Id
          try {
            Set-TimeZone -Id 'Pacific Standard Time'
            if ((Get-TimeZone).Id -ne 'Pacific Standard Time') { throw 'Pacific timezone test setup failed' }
            dotnet run --project tests/TrackerTests.csproj -c Release
            if ($LASTEXITCODE -ne 0) { throw 'State/history/clock tests failed' }
          } finally { Set-TimeZone -Id $originalZone }
      - name: Publish standalone Windows executable
        run: dotnet publish src/TreasureLedger.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o dist
      - name: Test packaged executable and render overlay
        shell: pwsh
        run: |
          $p = Start-Process ./dist/TreasureLedger.exe -ArgumentList '--self-test' -Wait -PassThru
          Get-Content smoke-test.txt
          if (Test-Path live-regression.txt) { Get-Content live-regression.txt }
          if ($p.ExitCode -ne 0 -and (Test-Path stack-debug.txt)) { Get-Content stack-debug.txt }
          if ($p.ExitCode -ne 0) { throw "Packaged app self-test failed: $($p.ExitCode)" }
      - name: Hash executable
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/TreasureLedger.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  TreasureLedger.exe" | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TreasureLedger-Windows-x64
          path: |
            dist/TreasureLedger.exe
            dist/SHA256SUMS.txt
            worker-dist/ReplayWorkerSource.zip
            overlay-preview.png
            overlay-large-counts.png
            overlay-background-check.png
            smoke-test.txt
            visual-regression.txt
            live-regression.txt
            japanese-ocr.txt
            japanese-ocr-sample.png
      - name: Publish downloadable build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "v0.4.3-build.${{ github.run_number }}"
          $notes = @'
          Fixes the replay UTC conversion bug confirmed by player diagnostics: the parser's unspecified-kind UTC ticks were incorrectly passed through local-time conversion, shifting Pacific timestamps by eight hours and preventing match reconciliation. Preserving their UTC meaning makes the anonymized player case reconcile 13 live openings with 15 replay chests, including two destroyed chests. Existing replay files are retried when this build starts, subject to the retained tracking start date.

          Reward recognition now uses only focused award-banner OCR, pairing its specific found/received header with a nearby category from the same captured sample. Broad scene OCR, generic Japanese acquired/XP text, owned/preview panels, unrelated inventory labels and ambiguous multi-category cards cannot count. Production capture must observe a clean award area before counting its first new drop. Gauntlet and back-bling identities cannot increment again after OCR flicker or restart; unidentified repeats are conservatively suppressed. Existing historical reward entries are retained rather than guessed away.

          History & settings → Review rewards lets you exclude false saved reward entries from totals and restore them later. Chest history is unaffected. English remains the new-install default; saved Japanese selections, rare-chest backup, lobby reset, Alt+T, transparency and after-match replay checks remain.

          Validation includes an anonymized relative-timing reproduction of the supplied replay diagnosis, UTC-kind handling, strict reward evidence/startup/deduplication/exclusion regressions, the packaged worker, existing Windows OCR/overlay checks, 10 recorded English chest sequences and Japanese screenshot tests. Japanese Windows OCR integration is skipped where its optional feature is absent. No full player screenshots or raw diagnostic history are included in the source.

          ReplayWorkerSource.zip contains the complete corresponding source/notices of the independent GPL worker, also extractable from the tray. No game memory access, injection, replay modification or automatic uploads.
          '@
          $notes | Set-Content release-notes.txt
          gh release create $tag dist/TreasureLedger.exe dist/SHA256SUMS.txt worker-dist/ReplayWorkerSource.zip --target '${{ github.sha }}' --title "Treasure Ledger $tag" --notes-file release-notes.txt --prerelease
