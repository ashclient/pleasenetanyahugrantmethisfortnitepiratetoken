name: Build Windows EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/checkout@v4
        with:
          repository: LED-N/Fortnite-ChestCounter
          ref: 1f387987737cfd606611d5b8d294d5db04af9eab
          path: external/chestreader
      - name: Build independent replay reader
        run: dotnet publish replay-worker/ReplayWorker.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -o worker-dist
      - name: Package corresponding replay-reader source
        run: python scripts/package_replay_worker.py
      - name: Test counting and history
        run: dotnet run --project tests/TrackerTests.csproj -c Release
      - name: Publish standalone Windows executable
        run: dotnet publish src/TreasureLedger.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o dist
      - name: Test packaged executable and render overlay
        shell: pwsh
        run: |
          $p = Start-Process ./dist/TreasureLedger.exe -ArgumentList '--self-test' -Wait -PassThru
          Get-Content smoke-test.txt
          if (Test-Path live-regression.txt) { Get-Content live-regression.txt }
          if ($p.ExitCode -ne 0 -and (Test-Path stack-debug.txt)) { Get-Content stack-debug.txt }
          if ($p.ExitCode -ne 0) { throw "Packaged app self-test failed: $($p.ExitCode)" }
      - name: Hash executable
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/TreasureLedger.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  TreasureLedger.exe" | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TreasureLedger-Windows-x64
          path: |
            dist/TreasureLedger.exe
            dist/SHA256SUMS.txt
            worker-dist/ReplayWorkerSource.zip
            overlay-preview.png
            overlay-large-counts.png
            overlay-background-check.png
            smoke-test.txt
            visual-regression.txt
            live-regression.txt
            japanese-ocr.txt
            japanese-ocr-sample.png
      - name: Publish downloadable build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "v0.4.1-build.${{ github.run_number }}"
          $notes = @'
          The live match counter now clears to zero when the lobby is confirmed, preserving the previous match in history and lifetime totals. English/Japanese lobby navigation plus the lower Play/Ready panel must be present in two fresh screen samples; an in-match Return to lobby button is not enough. A late replay correction updates the finished match without putting its old count back on the overlay. Repeated lobby frames do not create empty matches. Waiting/bus detection remains a fallback for the next game.

          The dedicated match reader now also reads full-screen lobby UI. Existing live chest matching, transparent overlay, Alt+T, rewards and completed-replay checking are retained. Record Replays must be enabled for after-match destroyed-chest reconciliation; live gameplay needs Windowed Fullscreen and the selected Windows OCR language feature. Real Japanese lobby capture and real completed replay attribution still need verification on the player PC.

          Checks include synthetic lobby lifecycle regressions, delayed frames, false menu/quest cues, late replay correction, packaged English Windows lobby OCR/reset, existing match/reconciliation checks, 10 recorded English live chest sequences, Japanese screenshot tests, overlay transparency/layout, click-through and Alt+T. Japanese Windows OCR integration is skipped if unavailable on the runner.

          ReplayWorkerSource.zip contains the independent GPL-3.0-or-later worker's complete corresponding source and notices and is also extractable from the tray. No game memory access, injection, replay modification or automatic uploads.
          '@
          $notes | Set-Content release-notes.txt
          gh release create $tag dist/TreasureLedger.exe dist/SHA256SUMS.txt worker-dist/ReplayWorkerSource.zip --target '${{ github.sha }}' --title "Treasure Ledger $tag" --notes-file release-notes.txt --prerelease
