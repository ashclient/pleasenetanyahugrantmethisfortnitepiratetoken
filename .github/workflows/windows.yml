name: Build Windows EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test counting and history
        run: dotnet run --project tests/TrackerTests.csproj -c Release
      - name: Publish standalone Windows executable
        run: dotnet publish src/TreasureLedger.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o dist
      - name: Test packaged executable and render overlay
        shell: pwsh
        run: |
          $p = Start-Process ./dist/TreasureLedger.exe -ArgumentList '--self-test' -Wait -PassThru
          Get-Content smoke-test.txt
          if (Test-Path live-regression.txt) { Get-Content live-regression.txt }
          if ($p.ExitCode -ne 0 -and (Test-Path stack-debug.txt)) { Get-Content stack-debug.txt }
          if ($p.ExitCode -ne 0) { throw "Packaged app self-test failed: $($p.ExitCode)" }
      - name: Hash executable
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/TreasureLedger.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  TreasureLedger.exe" | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TreasureLedger-Windows-x64
          path: |
            dist/TreasureLedger.exe
            dist/SHA256SUMS.txt
            overlay-preview.png
            overlay-large-counts.png
            overlay-background-check.png
            smoke-test.txt
            visual-regression.txt
            live-regression.txt
            japanese-ocr.txt
            japanese-ocr-sample.png
      - name: Publish downloadable build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "v0.3.1-build.${{ github.run_number }}"
          $notes = @'
          Fixes automatic match-counter resets: no three-minute minimum; repeated waiting/bus frames stay in one match; short games and missed result banners are handled. Pregame header OCR has its own background worker, separate from reward OCR and fast chest detection. Two fresh header samples confirm a new match during gameplay. Timestamped OCR prevents delayed results or old waiting-room frames from resetting the current match. Restarting the app resumes an unfinished match. Existing lifetime totals are preserved.

          Keeps the transparent icon overlay, Alt+T click-through toggle, live chest popup tracker, English/Japanese selector and persistent reward history. Save diagnosis now also retains low-resolution screen context and timestamped OCR samples locally, helping inspect notifications outside the XP region. Diagnostic images can contain visible player names; nothing uploads automatically.

          Destroyed-chest counting has not been added: the supplied trace did not contain a distinct identifiable destruction notification in its recorded regions. Replay import is not included. Counts remain estimates from visible notifications; disabling them, missed match banners, unusual HUD settings or missing Windows OCR language features can still affect detection. Run Fortnite in Windowed Fullscreen.

          Validation: match-state and persistence regressions, packaged executable smoke test, 10 recorded English chest sequences, Japanese chest/gizmo screenshot tests, transparent overlay layout, large counts, click-through and Alt+T. Japanese OCR integration is skipped on runners without its optional Windows language feature; see smoke-test.txt. Live match-boundary capture still needs verification on the player PC.
          '@
          $notes | Set-Content release-notes.txt
          gh release create $tag dist/TreasureLedger.exe dist/SHA256SUMS.txt --target '${{ github.sha }}' --title "Treasure Ledger $tag" --notes-file release-notes.txt --prerelease
