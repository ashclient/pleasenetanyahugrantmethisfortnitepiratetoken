name: Build Windows EXE
on:
  push:
    branches: [main]
    paths-ignore:
      - 'sync-service/**'
      - 'scripts/test_link_service.py'
      - '.github/workflows/cloudflare.yml'
      - '.github/workflows/windows.yml'
      - 'README.md'
  workflow_call:
    inputs:
      sync_endpoint:
        required: true
        type: string
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Cloudflare endpoint when available
        env:
          SYNC_ENDPOINT: ${{ inputs.sync_endpoint }}
        run: python sync-service/configure_client.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/checkout@v4
        with:
          repository: LED-N/Fortnite-ChestCounter
          ref: 1f387987737cfd606611d5b8d294d5db04af9eab
          path: external/chestreader
      - name: Build independent replay reader
        run: dotnet publish replay-worker/ReplayWorker.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -o worker-dist
      - name: Package corresponding replay-reader source
        run: python scripts/package_replay_worker.py
      - name: Test counting and history in Pacific timezone
        shell: pwsh
        run: |
          $originalZone = (Get-TimeZone).Id
          try {
            Set-TimeZone -Id 'Pacific Standard Time'
            if ((Get-TimeZone).Id -ne 'Pacific Standard Time') { throw 'Pacific timezone test setup failed' }
            dotnet run --project tests/TrackerTests.csproj -c Release
            if ($LASTEXITCODE -ne 0) { throw 'State/history/clock tests failed' }
          } finally { Set-TimeZone -Id $originalZone }
      - name: Publish standalone Windows executable
        run: dotnet publish src/TreasureLedger.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o dist
      - name: Test packaged executable and render overlay
        shell: pwsh
        run: |
          $p = Start-Process ./dist/TreasureLedger.exe -ArgumentList '--self-test' -Wait -PassThru
          Get-Content smoke-test.txt
          if (Test-Path live-regression.txt) { Get-Content live-regression.txt }
          if ($p.ExitCode -ne 0 -and (Test-Path stack-debug.txt)) { Get-Content stack-debug.txt }
          if ($p.ExitCode -ne 0) { throw "Packaged app self-test failed: $($p.ExitCode)" }
      - name: Hash executable
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/TreasureLedger.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  TreasureLedger.exe" | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TreasureLedger-Windows-x64
          path: |
            dist/TreasureLedger.exe
            dist/SHA256SUMS.txt
            worker-dist/ReplayWorkerSource.zip
            overlay-preview.png
            overlay-large-counts.png
            overlay-background-check.png
            settings-*.png
            smoke-test.txt
            visual-regression.txt
            live-regression.txt
            japanese-ocr.txt
            japanese-ocr-sample.png
      - name: Publish downloadable build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "v0.5.3-build.${{ github.run_id }}"
          $notes = @'
          Version 0.5.3 adds persistent Show overlay controls in Settings and the tray, a Reset overlay position button, and total tracked match counts in Overview and Settings. Hidden overlays do not pause tracking. English matching now covers several HUD text sizes; Japanese includes a smaller text size. A dedicated label-plus-XP OCR confirmation can fill ordinary and rare chest misses live in either language instead of waiting for the popup to end; visual/OCR evidence is deduplicated. Actual gameplay detection still depends on visible notifications; additional diagnostics may be needed for unobserved misses.

          Rare-chest coverage additionally includes RARE CHEST SEARCHED / SEARCHED A RARE CHEST, Japanese opened-label variants, zero/O confusion within XP digits, a wider/lower notification crop and a raw-color OCR pass when contrast OCR fails. Two focused samples plus XP are still required; quest and interaction labels stay excluded.

          The included sync fixes embed the direct Cloudflare endpoint in the source default as well as the release build. Every participant should update and use the same group's invite code; groups support up to 32 members. The previous ChatGPT-hosted endpoint returns HTML HTTP 401, which older clients displayed only as 'Sync request failed'. Errors now include HTTP status and server host without exposing credentials or raw HTML. Temporary HTML/proxy failures preserve membership and retry automatically; HTTP timeouts no longer escape background sync.

          Live validation confirmed three and four members, correct combined counts and concurrent updates; added native regression tests cover multi-member sums, HTML rejections, recovery, revoked membership and timeouts.

          Settings has separate Overview, Matches, Rewards, Linked counts, Settings and Diagnostics pages. Match rows update in place; tracking ticks no longer rebuild the lists or interrupt scrolling and selection.

          Chest overlay order: current game / all-time tracked / linked all-time tracked. The previous game stays visible in the lobby, receives replay corrections, and switches only after the next game's first chest and the prior replay check. New-game detections keep saving while waiting. If a replay is unavailable, Settings can release the held display; disabling replay checks also releases it.

          Online invite-code pairing shares display names and total chest/reward counts with your private group. Each installation has a persistent identity and revisioned snapshot: reopening replaces its contribution, never adds its lifetime count twice. Linked totals include you; offline peers keep their last synced contribution. Creators can remove members (rotating the invite code) or close the group. No screenshots, replays or match history are uploaded. Keep invite codes private; deleting local pairing identity requires removing its previous member entry.

          Existing recognition, history, transparency, Alt+T interaction lock and language preferences remain. English is the new-install default. ReplayWorkerSource.zip contains the corresponding independent GPL worker source and licenses.

          Validation: counting/history/display lifecycle and pairing persistence tests, packaged worker/OCR/live notification regressions, settings scroll/selection checks and rendered settings previews. Live gameplay capture still depends on visible Fortnite notifications and available completed replays.
          '@
          $notes | Set-Content release-notes.txt
          gh release create $tag dist/TreasureLedger.exe dist/SHA256SUMS.txt worker-dist/ReplayWorkerSource.zip --target '${{ github.sha }}' --title "Treasure Ledger $tag" --notes-file release-notes.txt --prerelease
