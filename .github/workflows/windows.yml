name: Build Windows EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/checkout@v4
        with:
          repository: LED-N/Fortnite-ChestCounter
          ref: 1f387987737cfd606611d5b8d294d5db04af9eab
          path: external/chestreader
      - name: Build independent replay reader
        run: dotnet publish replay-worker/ReplayWorker.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -o worker-dist
      - name: Package corresponding replay-reader source
        run: python scripts/package_replay_worker.py
      - name: Test counting and history
        run: dotnet run --project tests/TrackerTests.csproj -c Release
      - name: Publish standalone Windows executable
        run: dotnet publish src/TreasureLedger.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o dist
      - name: Test packaged executable and render overlay
        shell: pwsh
        run: |
          $p = Start-Process ./dist/TreasureLedger.exe -ArgumentList '--self-test' -Wait -PassThru
          Get-Content smoke-test.txt
          if (Test-Path live-regression.txt) { Get-Content live-regression.txt }
          if ($p.ExitCode -ne 0 -and (Test-Path stack-debug.txt)) { Get-Content stack-debug.txt }
          if ($p.ExitCode -ne 0) { throw "Packaged app self-test failed: $($p.ExitCode)" }
      - name: Hash executable
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/TreasureLedger.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  TreasureLedger.exe" | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TreasureLedger-Windows-x64
          path: |
            dist/TreasureLedger.exe
            dist/SHA256SUMS.txt
            worker-dist/ReplayWorkerSource.zip
            overlay-preview.png
            overlay-large-counts.png
            overlay-background-check.png
            smoke-test.txt
            visual-regression.txt
            live-regression.txt
            japanese-ocr.txt
            japanese-ocr-sample.png
      - name: Publish downloadable build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "v0.4.0-build.${{ github.run_number }}"
          $notes = @'
          Adds automatic completed-replay checking alongside the existing live overlay. The bundled independent reader uses LED-N's pinned parser to read destroyed-chest attribution (including support destruction/explosions) for the player recording each replay. After a match ends, only the deficit between its replay total and its saved live count is added; chests already counted live are not added twice. History shows the replay's destroyed count separately. Reward counts still use the live detector.

          Turn on Fortnite Settings → Game → Replays → Record Replays. The default Saved/Demos folder is checked automatically; a custom folder and disable toggle are available in the tray. Checking starts with games completed after the first launch of this version. Live encrypted replays wait for the decryption key, normally written at match end. Missing keys, incomplete files, unsupported game updates or ambiguous match histories leave saved counts unchanged and show a status/error. Lower replay totals are flagged instead of deleting live history.

          This is experimental: parser construction, bundled-worker launch/source extraction and reconciliation are tested, alongside the existing 10 recorded live chest sequences and Japanese screenshot tests. Actual encrypted replay parsing and player attribution have not yet been verified with this user's completed replay. Do not treat counts as authoritative game telemetry. The live chest detector, transparent overlay, Alt+T and match-reset logic are retained.

          Replay worker corresponding source and all original licenses are in ReplayWorkerSource.zip (also extractable from the tray). The independent GPL-3.0-or-later worker uses the MIT LED-N/FortniteReplayDecompressor code and GPL OozSharp decompressor. No game memory access, injection, replay modification or automatic uploads.
          '@
          $notes | Set-Content release-notes.txt
          gh release create $tag dist/TreasureLedger.exe dist/SHA256SUMS.txt worker-dist/ReplayWorkerSource.zip --target '${{ github.sha }}' --title "Treasure Ledger $tag" --notes-file release-notes.txt --prerelease
